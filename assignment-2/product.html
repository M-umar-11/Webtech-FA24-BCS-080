
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classic T-Shirt | COUGAR</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Announcement Bar -->
    <div class="announcement-bar text-center">
        Free Shipping on Selected Orders
    </div>

    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg bg-white">
            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    COUGAR
                </a>

                <a class="cart-link" href="#" aria-label="Shopping cart">
                    🛒 BAG
                </a>

            </div>
        </nav>
    </header>

    <!-- Product Detail Section -->
    <main class="container product-detail-section py-5">

        <div class="row g-5 align-items-center">

            <!-- Product Image -->
            <div class="col-12 col-md-6">
                <img
                    src="Images/T-shirt.webp"
                    class="detail-product-image"
                    alt="Classic T-Shirt"
                >
            </div>

            <!-- Product Information -->
            <div class="col-12 col-md-6">

                <p class="product-category-label">
                    MEN / T-SHIRTS
                </p>

                <h1 class="detail-product-title">
                    Classic T-Shirt
                </h1>

                <p class="detail-product-price">
                    Rs. 1,499
                </p>

                <p class="detail-product-description">
                    A versatile everyday T-shirt with a clean,
                    casual style. Pair it with jeans or trousers
                    for a comfortable everyday look.
                </p>

                <!-- Quantity Selector -->
                <label for="quantity" class="quantity-label">
                    Quantity
                </label>

                <select id="quantity" class="quantity-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <!-- Add to Cart -->
                <button type="button" class="add-cart-btn detail-cart-btn">
                    Add to Cart
                </button>

                <a href="index.html" class="back-to-shop">
                    ← Continue Shopping
                </a>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer text-center">
        <p>© 2026 COUGAR. All rights reserved.</p>
    </footer>

</body>
</html>
