
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Cougar</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Existing CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar bg-white">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">COUGAR</a>
                <a class="cart-link" href="index.html">BACK TO SHOP</a>
            </div>
        </nav>
    </header>

    <main class="container checkout-container">
        <h1 class="checkout-title">Checkout</h1>

        <form action="#" method="get" class="checkout-form">

            <fieldset class="checkout-fieldset">
                <legend>Contact Information</legend>

                <div class="checkout-field">
                    <label for="full-name">Full Name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full-name"
                        placeholder="Enter your full name"
                        required
                    >
                    <span class="error-message">Please enter your full name.</span>
                </div>

                <div class="checkout-field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                    <span class="error-message">Please enter a valid email.</span>
                </div>

                <div class="checkout-field">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="0300-1234567"
                        pattern="03[0-9]{2}-[0-9]{7}"
                        title="Format: 03XX-XXXXXXX"
                        required
                    >
                    <span class="error-message">Use format 03XX-XXXXXXX.</span>
                </div>
            </fieldset>

            <fieldset class="checkout-fieldset">
                <legend>Delivery Information</legend>

                <div class="checkout-field">
                    <label for="address">Delivery Address</label>
                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        required
                    >
                    <span class="error-message">Please enter your address.</span>
                </div>

                <div class="checkout-field">
                    <label for="city">City</label>
                    <select id="city" name="city" required>
                        <option value="">Select your city</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Karachi">Karachi</option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Multan">Multan</option>
                        <option value="Faisalabad">Faisalabad</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="error-message">Please select your city.</span>
                </div>

                <div class="checkout-field">
                    <label for="delivery-date">Delivery Date</label>
                    <input
                        type="date"
                        id="delivery-date"
                        name="delivery-date"
                        min="2026-10-29"
                        max="2027-01-17"
                        required
                    >
                    <span class="error-message">Choose a date within the allowed range.</span>
                </div>
            </fieldset>

            <button type="submit" class="checkout-submit">
                Place Order
            </button>

        </form>
    </main>

</body>
</html>
